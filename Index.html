<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GASPACHO - AI Interface</title>
    <style>
        /* --- ESTILOS BASE FUTURISTAS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050814;
            color: #e0e6ed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 40px 20px;
            overflow: hidden;
            background-image:
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        header {
            text-align: center;
            z-index: 10;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            color: #00f3ff;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.9rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- CONTENEDOR CENTRAL: EL CEREBRO / ORBE --- */
        .core-container {
            --audioScale: 1;
            --audioSkew: 0deg;
            --audioGlow: 0.5;
            --audioBlur: 0px;
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 18px 0;
            filter: drop-shadow(0 0 calc(20px * var(--audioGlow)) rgba(0, 243, 255, 0.32));
        }

        .ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(0, 243, 255, 0.2);
            border-radius: 50%;
            animation: rotateClockwise 20s linear infinite;
        }

        .ring-mid {
            position: absolute;
            width: 80%;
            height: 80%;
            border: 2px solid transparent;
            border-top: 2px solid rgba(147, 51, 234, 0.4);
            border-bottom: 2px solid rgba(147, 51, 234, 0.4);
            border-radius: 50%;
            animation: rotateCounterClockwise 10s linear infinite;
        }

        .orbe-core {
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, #00f3ff 0%, rgba(0, 10, 30, 0.8) 70%);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.4);
            transition: all 0.18s ease;
            transform: scale(var(--audioScale)) skew(var(--audioSkew));
            filter: blur(var(--audioBlur));
        }

        .audio-tuner {
            position: absolute;
            width: 210px;
            height: 66px;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .audio-tuner span {
            width: 8px;
            height: 12px;
            border-radius: 10px 10px 2px 2px;
            background: linear-gradient(180deg, #00ff66 0%, #00f3ff 100%);
            box-shadow: 0 0 14px rgba(0, 255, 102, 0.7);
            transform-origin: bottom;
        }

        .state-speaking .audio-tuner {
            opacity: 1;
        }

        .state-speaking .audio-tuner span:nth-child(1) { animation: barVoice 0.34s ease-in-out infinite alternate; }
        .state-speaking .audio-tuner span:nth-child(2) { animation: barVoice 0.27s ease-in-out infinite alternate; }
        .state-speaking .audio-tuner span:nth-child(3) { animation: barVoice 0.22s ease-in-out infinite alternate; }
        .state-speaking .audio-tuner span:nth-child(4) { animation: barVoice 0.30s ease-in-out infinite alternate; }
        .state-speaking .audio-tuner span:nth-child(5) { animation: barVoice 0.25s ease-in-out infinite alternate; }
        .state-speaking .audio-tuner span:nth-child(6) { animation: barVoice 0.32s ease-in-out infinite alternate; }
        .state-speaking .audio-tuner span:nth-child(7) { animation: barVoice 0.24s ease-in-out infinite alternate; }
        .state-speaking .audio-tuner span:nth-child(8) { animation: barVoice 0.29s ease-in-out infinite alternate; }

        /* --- ESTADOS DINÁMICOS DEL ORBE --- */
        .state-idle .orbe-core {
            animation: pulseIdle 3s ease-in-out infinite;
        }

        .state-listening .orbe-core {
            background: radial-gradient(circle, #ff0077 0%, rgba(30, 0, 10, 0.8) 70%);
            box-shadow: 0 0 60px #ff0077, inset 0 0 20px rgba(255, 255, 255, 0.6);
            transform: scale(1.15);
            animation: voiceWave 0.4s ease-in-out infinite alternate;
        }

        .state-listening .ring-outer {
            border-color: rgba(255, 0, 119, 0.5);
            animation-duration: 5s;
        }

        .state-thinking .orbe-core {
            background: radial-gradient(circle, #9333ea 0%, rgba(15, 0, 30, 0.8) 70%);
            box-shadow: 0 0 50px #9333ea, inset 0 0 20px rgba(255, 255, 255, 0.5);
            animation: spinFast 1s linear infinite;
        }

        .state-thinking .ring-mid {
            border-top-color: #9333ea;
            border-bottom-color: #9333ea;
            animation-duration: 2s;
        }

        .state-speaking .orbe-core {
            background: radial-gradient(circle, #00ff66 0%, rgba(0, 30, 10, 0.8) 70%);
            box-shadow:
                0 0 calc(42px * var(--audioGlow)) #00ff66,
                0 0 calc(90px * var(--audioGlow)) rgba(0, 243, 255, 0.45),
                inset 0 0 24px rgba(255, 255, 255, 0.55);
            border-radius: 45% 55% 52% 48% / 48% 44% 56% 52%;
            animation: voiceWave 0.2s ease-in-out infinite alternate, morphCore 0.9s ease-in-out infinite;
        }

        .state-speaking .ring-outer {
            border-color: rgba(0, 255, 102, 0.45);
            animation-duration: 4s;
        }

        .state-speaking .ring-mid {
            border-top-color: rgba(0, 255, 102, 0.8);
            border-bottom-color: rgba(0, 243, 255, 0.8);
            animation-duration: 1.2s;
        }

        /* --- CONTROLES Y PANTALLA DE TEXTO --- */
        .console-container {
            width: 100%;
            max-width: 760px;
            text-align: center;
            z-index: 10;
        }

        .text-display {
            background: rgba(10, 20, 40, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            min-height: 62px;
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 18px;
            font-size: 1rem;
            line-height: 1.5;
            color: #a1b0cb;
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.05);
        }

        .btn-mic {
            background: transparent;
            border: 2px solid #00f3ff;
            color: #00f3ff;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            outline: none;
        }

        .btn-mic:hover {
            background: #00f3ff;
            color: #050814;
            box-shadow: 0 0 25px #00f3ff;
        }

        .btn-mic:disabled {
            border-color: #475569;
            color: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* --- GLOBOS DE COMUNICACIÓN TIPO CÓMIC --- */
        .bubble-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
            max-height: 290px;
            overflow-y: auto;
            padding: 4px 6px 8px 6px;
        }

        .speech-bubble {
            display: none;
            position: relative;
            text-align: left;
            padding: 16px 46px 16px 18px;
            border-radius: 22px;
            line-height: 1.5;
            white-space: pre-line;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.28);
            animation: bubbleIn 0.25s ease-out;
        }

        .speech-bubble.user {
            align-self: flex-end;
            max-width: 88%;
            background: rgba(0, 243, 255, 0.12);
            border: 1px solid rgba(0, 243, 255, 0.35);
            color: #d8fbff;
        }

        .speech-bubble.user::after {
            content: "";
            position: absolute;
            right: 22px;
            bottom: -10px;
            border-width: 10px 0 0 12px;
            border-style: solid;
            border-color: transparent transparent transparent rgba(0, 243, 255, 0.35);
        }

        .speech-bubble.gaspacho {
            align-self: flex-start;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.96);
            color: #111827;
            border: 1px solid rgba(255, 255, 255, 0.72);
        }

        .speech-bubble.gaspacho::after {
            content: "";
            position: absolute;
            left: 22px;
            bottom: -10px;
            border-width: 10px 12px 0 0;
            border-style: solid;
            border-color: rgba(255, 255, 255, 0.96) transparent transparent transparent;
        }

        .bubble-close {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid rgba(15, 23, 42, 0.18);
            background: rgba(15, 23, 42, 0.08);
            color: inherit;
            font-size: 18px;
            line-height: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .bubble-close:hover {
            transform: scale(1.08);
            background: rgba(239, 68, 68, 0.14);
            border-color: rgba(239, 68, 68, 0.35);
        }

        .status-line {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 10px;
            min-height: 20px;
        }

        @keyframes bubbleIn {
            from { transform: translateY(8px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes rotateClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateCounterClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        @keyframes pulseIdle {
            0% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 30px rgba(0, 243, 255, 0.3); }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 50px rgba(0, 243, 255, 0.6); }
            100% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 30px rgba(0, 243, 255, 0.3); }
        }

        @keyframes voiceWave {
            0% { transform: scale(1.05); }
            100% { transform: scale(1.15); }
        }

        @keyframes spinFast {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(0.95); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes barVoice {
            0% { transform: scaleY(0.45); opacity: 0.55; }
            100% { transform: scaleY(3.4); opacity: 1; }
        }

        @keyframes morphCore {
            0% { border-radius: 45% 55% 52% 48% / 48% 44% 56% 52%; }
            33% { border-radius: 54% 46% 42% 58% / 51% 57% 43% 49%; }
            66% { border-radius: 39% 61% 56% 44% / 58% 39% 61% 42%; }
            100% { border-radius: 45% 55% 52% 48% / 48% 44% 56% 52%; }
        }

        @media (max-width: 760px) {
            body { padding: 26px 14px; }
            header h1 { font-size: 2rem; }
            .core-container { width: 240px; height: 240px; }
            .console-container { max-width: 100%; }
            .bubble-panel { max-height: 310px; }
            .btn-mic { width: 100%; padding: 14px 18px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>GASPACHO</h1>
        <p>Sistema de Control e Históricos - Cargomobility</p>
    </header>

    <div id="visualCoreContainer" class="core-container state-idle">
        <div class="ring-outer"></div>
        <div class="ring-mid"></div>
        <div class="orbe-core"></div>
        <div class="audio-tuner" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>
    </div>

    <div class="console-container">
        <div class="bubble-panel" id="bubblePanel">
            <div id="userBubble" class="speech-bubble user">
                <button class="bubble-close" type="button" aria-label="Cerrar mensaje" onclick="cerrarBurbuja('user')">×</button>
                <span id="userBubbleText"></span>
            </div>
            <div id="gaspachoBubble" class="speech-bubble gaspacho">
                <button class="bubble-close" type="button" aria-label="Cerrar respuesta" onclick="cerrarBurbuja('gaspacho')">×</button>
                <span id="gaspachoBubbleText"></span>
            </div>
        </div>

        <div id="statusLine" class="status-line">Esperando comando...</div>
        <div id="textDisplay" class="text-display">Sistema listo. Presiona el botón para consultar...</div>

        <button id="btnMic" class="btn-mic">Hablar con Gaspacho</button>
    </div>

    <script>
        // CONFIGURACIÓN WEBHOOK N8N
        // Para pruebas con "Listen for test event", cambia USE_TEST_WEBHOOK a true.
        // Para uso real desde GitHub Pages, publica/activa el workflow en n8n y deja USE_TEST_WEBHOOK en false.
        const USE_TEST_WEBHOOK = false;

        const N8N_WEBHOOK_TEST_URL = 'https://gaspachoai.app.n8n.cloud/webhook-test/gaspacho-web';
        const N8N_WEBHOOK_PROD_URL = 'https://gaspachoai.app.n8n.cloud/webhook/gaspacho-web';

        const N8N_WEBHOOK_URL = USE_TEST_WEBHOOK
            ? N8N_WEBHOOK_TEST_URL
            : N8N_WEBHOOK_PROD_URL;

        const btnMic = document.getElementById('btnMic');
        const textDisplay = document.getElementById('textDisplay');
        const userBubble = document.getElementById('userBubble');
        const userBubbleText = document.getElementById('userBubbleText');
        const gaspachoBubble = document.getElementById('gaspachoBubble');
        const gaspachoBubbleText = document.getElementById('gaspachoBubbleText');
        const statusLine = document.getElementById('statusLine');
        const visualCore = document.getElementById('visualCoreContainer');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;

        let recognition = null;
        let voicePulseTimer = null;

        if (!SpeechRecognition) {
            textDisplay.innerHTML = 'Error: Este navegador no soporta reconocimiento de voz nativo. Usa Google Chrome o Edge.';
            btnMic.disabled = true;
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-CL';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
        }

        function changeState(state) {
            visualCore.className = 'core-container';
            if (state === 'idle') visualCore.classList.add('state-idle');
            if (state === 'listening') visualCore.classList.add('state-listening');
            if (state === 'thinking') visualCore.classList.add('state-thinking');
            if (state === 'speaking') visualCore.classList.add('state-speaking');
        }

        function resetVoiceVisuals() {
            stopVoicePulse();
            visualCore.style.setProperty('--audioScale', '1');
            visualCore.style.setProperty('--audioSkew', '0deg');
            visualCore.style.setProperty('--audioGlow', '0.5');
            visualCore.style.setProperty('--audioBlur', '0px');
        }

        function startVoicePulse() {
            stopVoicePulse();
            voicePulseTimer = setInterval(() => {
                const scale = (1.03 + Math.random() * 0.22).toFixed(2);
                const skew = ((Math.random() - 0.5) * 7).toFixed(2) + 'deg';
                const glow = (0.7 + Math.random() * 0.95).toFixed(2);
                const blur = (Math.random() * 0.7).toFixed(2) + 'px';

                visualCore.style.setProperty('--audioScale', scale);
                visualCore.style.setProperty('--audioSkew', skew);
                visualCore.style.setProperty('--audioGlow', glow);
                visualCore.style.setProperty('--audioBlur', blur);
            }, 120);
        }

        function stopVoicePulse() {
            if (voicePulseTimer) {
                clearInterval(voicePulseTimer);
                voicePulseTimer = null;
            }
        }

        btnMic.addEventListener('click', () => {
            if (!recognition) return;

            if (synth && synth.speaking) {
                synth.cancel();
                resetVoiceVisuals();
            }

            try {
                recognition.start();
            } catch (e) {
                console.log('El reconocimiento ya estaba iniciado');
            }
        });

        if (recognition) {
            recognition.onstart = () => {
                changeState('listening');
                textDisplay.innerText = 'Escuchando...';
                setStatus('Escuchando comando...');
                btnMic.innerText = 'Escuchando...';
                btnMic.disabled = true;
            };

            recognition.onerror = (event) => {
                console.error(event.error);
                changeState('idle');
                textDisplay.innerText = 'No logré escucharte con claridad. Intenta de nuevo.';
                setStatus('No se pudo capturar audio.');
                btnMic.disabled = false;
                btnMic.innerText = 'Hablar con Gaspacho';
            };

            recognition.onspeechend = () => {
                recognition.stop();
            };

            recognition.onend = () => {
                if (btnMic.innerText === 'Escuchando...') {
                    btnMic.disabled = false;
                    btnMic.innerText = 'Hablar con Gaspacho';
                    changeState('idle');
                }
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                mostrarPreguntaUsuario(transcript);

                changeState('thinking');
                setStatus('Procesando consulta...');
                btnMic.innerText = 'Procesando...';
                btnMic.disabled = true;

                await consultarGaspachoN8N(transcript);
            };
        }

        async function consultarGaspachoN8N(preguntaUsuario) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 90000);

            try {
                setStatus('Consultando núcleo n8n...');
                btnMic.disabled = true;

                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json; charset=utf-8'
                    },
                    body: JSON.stringify({
                        mensaje: preguntaUsuario,
                        usuario: 'Andres',
                        canal: 'web_gaspacho',
                        timestamp: new Date().toISOString()
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error(`Error HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                const respuestaIA =
                    data.respuesta ||
                    data.output ||
                    data.response ||
                    data.text ||
                    data.message ||
                    'No recibí una respuesta clara desde el núcleo de datos.';

                mostrarRespuestaGaspacho(respuestaIA);
                hablarRespuesta(respuestaIA);

            } catch (error) {
                clearTimeout(timeoutId);
                console.error(error);

                const mensajeError = error.name === 'AbortError'
                    ? 'La consulta tardó demasiado. Intenta nuevamente.'
                    : 'Error de conexión con el núcleo de datos de n8n.';

                changeState('idle');
                resetVoiceVisuals();
                setStatus('Error de conexión.');
                mostrarRespuestaGaspacho(mensajeError);
                btnMic.disabled = false;
                btnMic.innerText = 'Hablar con Gaspacho';
            }
        }

        function mostrarPreguntaUsuario(texto) {
            if (userBubbleText && userBubble) {
                userBubbleText.innerText = `Tú: ${texto}`;
                userBubble.style.display = 'block';
            }
            textDisplay.innerText = `Comando recibido: "${texto}"`;
        }

        function limpiarTextoParaPantalla(texto) {
            return String(texto || '')
                .replace(/^#{1,6}\s*/gm, '')
                .replace(/\*\*/g, '')
                .replace(/`/g, '')
                .replace(/^\s*[-•]\s+/gm, '• ')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
        }

        function mostrarRespuestaGaspacho(texto) {
            const textoPantalla = limpiarTextoParaPantalla(texto);
            if (gaspachoBubbleText && gaspachoBubble) {
                gaspachoBubbleText.innerText = `Gaspacho:\n${textoPantalla}`;
                gaspachoBubble.style.display = 'block';
            }
            textDisplay.innerText = 'Respuesta recibida desde Gaspacho.';
            setStatus('Respuesta lista.');
        }

        function cerrarBurbuja(tipo) {
            if (tipo === 'user' && userBubble) {
                userBubble.style.display = 'none';
                if (userBubbleText) userBubbleText.innerText = '';
            }

            if (tipo === 'gaspacho' && gaspachoBubble) {
                gaspachoBubble.style.display = 'none';
                if (gaspachoBubbleText) gaspachoBubbleText.innerText = '';
            }

            if (synth && synth.speaking) {
                synth.cancel();
            }

            resetVoiceVisuals();
            changeState('idle');
            setStatus('Esperando comando...');
            textDisplay.innerText = 'Sistema listo. Presiona el botón para consultar...';
            btnMic.disabled = false;
            btnMic.innerText = 'Hablar con Gaspacho';
        }

        function setStatus(texto) {
            if (statusLine) statusLine.innerText = texto;
        }

        function limpiarTextoParaVoz(texto) {
            return String(texto || '')
                .replace(/^#{1,6}\s*/gm, '')
                .replace(/#{1,6}/g, '')
                .replace(/\*\*/g, '')
                .replace(/\*/g, '')
                .replace(/`/g, '')
                .replace(/^\s*[-•]\s+/gm, '')
                .replace(/^\s*\d+\.\s+/gm, '')
                .replace(/---+/g, ' ')
                .replace(/___+/g, ' ')
                .replace(/_/g, ' ')
                .replace(/\|/g, ' ')
                .replace(/\n{2,}/g, '. ')
                .replace(/\n/g, '. ')
                .replace(/\s{2,}/g, ' ')
                .trim();
        }

        function hablarRespuesta(texto) {
            if (!synth) {
                btnMic.disabled = false;
                btnMic.innerText = 'Hablar con Gaspacho';
                return;
            }

            const textoVoz = limpiarTextoParaVoz(texto);
            const utterance = new SpeechSynthesisUtterance(textoVoz);
            utterance.lang = 'es-CL';

            const voices = synth.getVoices();
            const vozEspanol = voices.find(voice => voice.lang && voice.lang.toLowerCase().includes('es'));
            if (vozEspanol) {
                utterance.voice = vozEspanol;
            }

            utterance.pitch = 0.95;
            utterance.rate = 1.0;

            utterance.onstart = () => {
                changeState('speaking');
                startVoicePulse();
                setStatus('Gaspacho respondiendo por voz...');
                btnMic.innerText = 'Hablando...';
                btnMic.disabled = true;
            };

            utterance.onboundary = () => {
                visualCore.style.setProperty('--audioScale', (1.08 + Math.random() * 0.2).toFixed(2));
                visualCore.style.setProperty('--audioGlow', (0.9 + Math.random() * 1.0).toFixed(2));
            };

            utterance.onend = () => {
                resetVoiceVisuals();
                changeState('idle');
                setStatus('Esperando comando...');
                btnMic.disabled = false;
                btnMic.innerText = 'Hablar con Gaspacho';
            };

            utterance.onerror = () => {
                resetVoiceVisuals();
                changeState('idle');
                setStatus('Error al reproducir voz.');
                btnMic.disabled = false;
                btnMic.innerText = 'Hablar con Gaspacho';
            };

            synth.cancel();
            synth.speak(utterance);
        }

        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
